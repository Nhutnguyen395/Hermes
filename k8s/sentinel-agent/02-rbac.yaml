# Create a dedicated identity for our agent
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-agent-sa
  namespace: default
---
# Define what this identity is allowed to do
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-agent-role
  namespace: default
rules:
  # Allow reading pods/logs (for context gathering)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Allow scaling deployments (for the scale_replica action
  - apiGroups: ["apps"]
    resources: ["deployment", "deployment/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
# Bind the role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-agent-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: sentinel-agent-sa
    namespace: default
roleRef:
  kind: Role
  name: sentinel-agent-role
  apiGroup: rbac.authorization.k8s.io