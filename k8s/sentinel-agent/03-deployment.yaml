apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-agent
  namespace: default
  labels:
    app: sentinel-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-agent
  template:
    metadata:
      labels:
        app: sentinel-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sentinel-agent-sa
      containers:
        - name: agent
          image: hermes-sentinel-agent:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sentinel-agent-config
            - secretRef:
                name: sentinel-agent-secret
---
# Expose the agent so Alertmanager and out dashboard can read it
apiVersion: v1
kind: Service
metadata:
  name: sentinel-agent-svc
  namespace: default
spec:
  selector:
    app: sentinel-agent
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080